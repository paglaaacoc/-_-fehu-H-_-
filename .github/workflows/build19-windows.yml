name: The Holy Quran TRP Build 1.9 R5 - Integrated Research Workstation CI

on:
  push:
    branches:
      - ci/build-1.9
    paths:
      - CI-SOURCE-PROVENANCE.json

permissions:
  contents: read

concurrency:
  group: thtrp-build-1.9-ci
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SOURCE_CANDIDATE_SHA: 6b54c3987934caa860094adcbc92ccf504b9342b
      ACCEPTED_BASE_SHA: 8a91a786f4df2d0c0b60d92cc781451e98fe6b0b
      THTRP_CI_MIRROR: '1'

    steps:
      - name: Checkout CI mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify CI source provenance
        shell: pwsh
        run: |
          $p = Get-Content -Raw ./CI-SOURCE-PROVENANCE.json | ConvertFrom-Json
          if ($p.source_candidate_sha -ne $env:SOURCE_CANDIDATE_SHA) {
            throw "CI mirror source SHA mismatch: $($p.source_candidate_sha)"
          }
          if ($p.accepted_base_sha -ne $env:ACCEPTED_BASE_SHA) {
            throw "CI mirror accepted-base SHA mismatch: $($p.accepted_base_sha)"
          }
          Write-Host "Authoritative source candidate: $($p.source_candidate_sha)"
          Write-Host "Frozen rollback ancestor: $($p.accepted_base_sha)"

      - name: Verify Build 1.9 R5 source, guide and contract
        shell: pwsh
        run: |
          $root = './src/QuranReconciliation'
          foreach ($file in @(
            'MainWindow.ContextAtlasCompare.cs', 'MainWindow.ContextAtlasPins.cs',
            'MainWindow.ContextAtlasEvidence.cs', 'MainWindow.ContextAtlasPairedReader.cs', 'MainWindow.UserGuide.cs',
            'Resources/Guides/THTRP-User-Guide.html',
            'Resources/ContextAtlas/HandoffTemplates/Common/02-IMPORT-PACKAGE-CONTRACT.md',
            'Resources/ContextAtlas/HandoffTemplates/Common/scripts/validate_proposal_package.py'
          )) {
            if (!(Test-Path (Join-Path $root $file))) { throw "Build 1.9 R5 file missing: $file" }
          }
          $xaml = Get-Content -Raw "$root/MainWindow.xaml"
          foreach ($marker in @('Build 1.9 R5','AtlasPinsTabButton','AtlasReadingSurroundingToggle','OpenUserGuide_Click','AtlasCompareReadingGrid','AtlasCompareReadingLeftScroll','AtlasCompareReadingRightScroll')) {
            if (!$xaml.Contains($marker)) { throw "Build 1.9 R5 XAML missing: $marker" }
          }
          $identity = Get-Content -Raw "$root/Infrastructure/BuildIdentity.cs"
          if (!$identity.Contains('"Build 1.9 R5"')) { throw 'Stale native Windows title.' }
          $paired = Get-Content -Raw "$root/MainWindow.ContextAtlasPairedReader.cs"
          foreach ($marker in @(
            'ReadRange(', 'AppendAtlasPairedReaderCards', 'RefreshAtlasPairedReadingWidths',
            'ApplyAtlasCompareReadingZoomMetrics', 'UpdateAtlasPairedReadingLayout'
          )) {
            if (!$paired.Contains($marker)) { throw "Missing dual-reader feature: $marker" }
          }
          $atlas = Get-Content -Raw "$root/MainWindow.ContextAtlas.cs"
          foreach ($needle in @(
            'AtlasSessionSelection.Restore(', 'if (_atlasCorpora.Count == 0 ||',
            'RefreshAtlasLiveResearchPane();', 'AtlasCompareASelector.SelectedIndex = restored.Left;',
            'AtlasCompareBSelector.SelectedIndex = restored.Right;'
          )) {
            if (!$atlas.Contains($needle)) { throw "Atlas session state restoration missing: $needle" }
          }
          if (!(Test-Path "$root/Infrastructure/AtlasSessionSelection.cs")) {
            throw 'Atlas corpus ID restoration helper is missing.'
          }
          $slices = Get-Content -Raw "$root/MainWindow.WorkingSlices.cs"
          if (!$slices.Contains('WorkingSliceNavigation.ShouldRefresh(')) {
            throw 'Working Slice reentry preservation is missing.'
          }
          $closing = Get-Content -Raw "$root/MainWindow.xaml.cs"
          $exitCode = Get-Content -Raw "$root/MainWindow.ExitConfirmation.cs"
          $settings = Get-Content -Raw "$root/Infrastructure/AppSettings.cs"
          foreach ($needle in @('ConfirmExitMenuItem','ConfirmNormalExitAsync','_exitAlreadyApproved','_ownerStateOperationActive')) {
            if (!($closing + $exitCode).Contains($needle)) { throw "Exit safety contract missing: $needle" }
          }
          if (!$xaml.Contains('ConfirmExitMenuItem') -or !$settings.Contains('ConfirmBeforeExit')) {
            throw 'Persisted optional exit control absent.'
          }
          Write-Host 'Build 1.9 R5 Working Slice and optional exit safety gate: PASS'

      - name: Test portable crash-recoverable research drafts
        shell: pwsh
        run: |
          dotnet run --project ./tools/DraftRecoveryProbe/DraftRecoveryProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Portable draft recovery test failed.' }

      - name: Compile v1.4 Context Atlas probe
        shell: pwsh
        run: |
          dotnet restore ./tools/V14ContextAtlasProbe/V14ContextAtlasProbe.csproj
          dotnet build ./tools/V14ContextAtlasProbe/V14ContextAtlasProbe.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "v1.4 Context Atlas probe compile failed." }

      - name: Compile native WinUI Build 1.9 R5 before long corpus jobs
        shell: pwsh
        run: |
          dotnet restore ./src/QuranReconciliation/QuranReconciliation.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "R2 WinUI restore failed." }
          dotnet build ./src/QuranReconciliation/QuranReconciliation.csproj -c Release -r win-x64 --no-restore -p:SourceRevisionId=$env:SOURCE_CANDIDATE_SHA
          if ($LASTEXITCODE -ne 0) { throw "R2 WinUI compile failed." }

      - name: Diagnose compiled original Windows icon before expensive corpus tests
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bin = './src/QuranReconciliation/bin/Release/net10.0-windows10.0.19041.0/win-x64'
          $exe = Join-Path $bin 'The Holy Quran TRP.exe'
          $icon = './src/QuranReconciliation/Assets/QuranReconciliation.ico'
          if (-not (Test-Path $exe)) { throw "Early icon diagnostic: compiled EXE missing at $exe." }
          $si = [System.Drawing.Icon]::new((Resolve-Path $icon))
          $ei = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe))
          if ($null -eq $ei) { throw "Compiled executable lacks icon." }
          $sbitmap = $si.ToBitmap()
          $ebitmap = $ei.ToBitmap()
          Write-Host "Source default icon: $($si.Width)x$($si.Height); bitmap: $($sbitmap.Width)x$($sbitmap.Height)"
          Write-Host "EXE default icon: $($ei.Width)x$($ei.Height); bitmap: $($ebitmap.Width)x$($ebitmap.Height)"
          $sourcePng=Join-Path $env:RUNNER_TEMP 'r2-source-icon-diagnostic.png'
          $exePng=Join-Path $env:RUNNER_TEMP 'r2-exe-icon-diagnostic.png'
          $sbitmap.Save($sourcePng,[System.Drawing.Imaging.ImageFormat]::Png)
          $ebitmap.Save($exePng,[System.Drawing.Imaging.ImageFormat]::Png)
          $sh=(Get-FileHash $sourcePng -Algorithm SHA256).Hash
          $eh=(Get-FileHash $exePng -Algorithm SHA256).Hash
          Write-Host "Source rendered SHA: $sh"
          Write-Host "EXE rendered SHA: $eh"
          if ($sbitmap.Width -ne $ebitmap.Width -or $sbitmap.Height -ne $ebitmap.Height) {
            throw "Compiled icon bitmap dimensions differ."
          }
          $different=0
          for($y=0;$y -lt $sbitmap.Height;$y++){
            for($x=0;$x -lt $sbitmap.Width;$x++){
              if ($sbitmap.GetPixel($x,$y).ToArgb() -ne $ebitmap.GetPixel($x,$y).ToArgb()) { $different++ }
            }
          }
          Write-Host "Different rendered pixels: $different / $($sbitmap.Width * $sbitmap.Height)"
          if ($different -ne 0) {
            throw "Compiled original icon is not pixel-identical to packaged icon."
          }
          if ($sh -ne $eh) { Write-Host "PNG metadata/serialization differs, but rendered pixels are identical." }
          $sbitmap.Dispose();$ebitmap.Dispose();$si.Dispose();$ei.Dispose()
          Write-Host 'Compiled original icon: PASS'

      - name: Restore inherited research probes
        shell: pwsh
        run: |
          dotnet restore ./tools/ContextWorkflowProbe/ContextWorkflowProbe.csproj
          dotnet restore ./tools/NoteWorkflowProbe/NoteWorkflowProbe.csproj
          dotnet restore ./tools/HistoryWorkflowProbe/HistoryWorkflowProbe.csproj
          dotnet restore ./tools/WorkingSliceWorkflowProbe/WorkingSliceWorkflowProbe.csproj
          dotnet restore ./tools/V13ResearchOrganizationProbe/V13ResearchOrganizationProbe.csproj
          dotnet restore ./tools/BackupWorkflowProbe/BackupWorkflowProbe.csproj
          dotnet restore ./tools/SafetyClosureProbe/SafetyClosureProbe.csproj
          dotnet restore ./tools/PortabilityProbe/PortabilityProbe.csproj

      - name: Run inherited v1.3 research/safety contracts
        shell: pwsh
        run: |
          dotnet run --project ./tools/ContextWorkflowProbe/ContextWorkflowProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Context workflow probe failed." }
          dotnet run --project ./tools/NoteWorkflowProbe/NoteWorkflowProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Note workflow probe failed." }
          dotnet run --project ./tools/HistoryWorkflowProbe/HistoryWorkflowProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "History workflow probe failed." }
          dotnet run --project ./tools/WorkingSliceWorkflowProbe/WorkingSliceWorkflowProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Working Slice workflow probe failed." }
          dotnet run --project ./tools/V13ResearchOrganizationProbe/V13ResearchOrganizationProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "v1.3 research organization probe failed." }
          dotnet run --project ./tools/BackupWorkflowProbe/BackupWorkflowProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Backup workflow probe failed." }
          dotnet run --project ./tools/SafetyClosureProbe/SafetyClosureProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "R11 safety-closure probe failed." }

      - name: Restore and build corpus builder
        shell: pwsh
        run: |
          dotnet restore ./tools/CorpusBuilder/CorpusBuilder.csproj
          dotnet build ./tools/CorpusBuilder/CorpusBuilder.csproj -c Release --no-restore

      - name: Reproduce exact pinned primary corpus
        shell: pwsh
        env:
          QURAN_CORPUS_BUILD_UTC: '2026-10-03T20:50:08.4604635+00:00'
        run: |
          dotnet run --project ./tools/CorpusBuilder/CorpusBuilder.csproj -c Release --no-build -- ./artifacts/Corpus
          $db = './artifacts/Corpus/corpus.sqlite'
          $hash = (Get-FileHash -LiteralPath $db -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '188e29730b62efaff748e160f73bb2e6665769df4fa779ee1436af939c6e7862'
          Write-Host "Primary corpus SHA-256: $hash"
          if ($hash -ne $expected) { throw "Pinned primary corpus mismatch." }

      - name: Verify pinned Juz metadata
        shell: pwsh
        run: |
          dotnet restore ./tools/JuzMetadataProbe/JuzMetadataProbe.csproj
          dotnet run --project ./tools/JuzMetadataProbe/JuzMetadataProbe.csproj -c Release -- ./artifacts/Corpus/corpus.sqlite ./src/QuranReconciliation/Resources/juz-map.json
          if ($LASTEXITCODE -ne 0) { throw "Juz metadata probe failed." }
          $hash = (Get-FileHash ./src/QuranReconciliation/Resources/juz-map.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '3016bb4f94af9a42c8c1c24728bf6044e5b4ac13130e47d451c0c10ba35dd434') {
            throw "Pinned Juz map changed."
          }

      - name: Verify stored translation footnotes
        shell: pwsh
        run: |
          @'
          import sqlite3
          con=sqlite3.connect(r"./artifacts/Corpus/corpus.sqlite")
          cur=con.cursor()
          count=cur.execute("select count(*) from translations where foot_notes_json not in ('{}','[]','null','')").fetchone()[0]
          by_resource=dict(cur.execute("select resource_id,count(*) from translations where foot_notes_json not in ('{}','[]','null','') group by resource_id").fetchall())
          expected={95:3961,20:1612,149:1526,203:718,85:1}
          assert count==7818,(count,by_resource)
          assert by_resource==expected,by_resource
          print("Pinned translation footnotes: PASS")
          '@ | python -

      - name: Restore and build word-by-word corpus
        shell: pwsh
        env:
          QURAN_WBW_BUILD_UTC: '2026-10-04T04:24:00+00:00'
        run: |
          dotnet restore ./tools/WordByWordBuilder/WordByWordBuilder.csproj
          dotnet build ./tools/WordByWordBuilder/WordByWordBuilder.csproj -c Release --no-restore
          dotnet run --project ./tools/WordByWordBuilder/WordByWordBuilder.csproj -c Release --no-build -- ./artifacts/Corpus
          $db = './artifacts/Corpus/word-by-word.sqlite'
          $hash = (Get-FileHash -LiteralPath $db -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'd119f2f113e916a9968f7275f87d31f1f8027ddcf2a5b1ff80e60b7c1b122a31') {
            throw "Pinned word-by-word DB changed: $hash"
          }

      - name: Verify offline word-by-word content
        shell: pwsh
        run: |
          @'
          import sqlite3
          con=sqlite3.connect(r"./artifacts/Corpus/word-by-word.sqlite")
          cur=con.cursor()
          assert cur.execute("select count(*) from words").fetchone()[0]==77429
          assert cur.execute("select count(distinct verse_key) from words").fetchone()[0]==6236
          assert cur.execute("select count(*) from words where trim(text_uthmani)='' or trim(translation_en)=''").fetchone()[0]==0
          sha=cur.execute("select value from meta where key='content_sha256'").fetchone()[0]
          assert sha=="74f0932e07d078c440f6b7e3246dc80822fbe87099a558138460fb01d6b538a7"
          print("Offline word-by-word resource: PASS")
          '@ | python -

      - name: Restore and run v1.4 Context Atlas dynamic probe
        shell: pwsh
        run: |
          dotnet run --project ./tools/V14ContextAtlasProbe/V14ContextAtlasProbe.csproj -c Release --no-build -- --repo-root . --corpus ./artifacts/Corpus/corpus.sqlite
          if ($LASTEXITCODE -ne 0) { throw "v1.4 Context Atlas dynamic probe failed." }

      - name: Restore native app
        shell: pwsh
        run: dotnet restore ./src/QuranReconciliation/QuranReconciliation.csproj -r win-x64

      - name: Build Release x64
        shell: pwsh
        run: dotnet build ./src/QuranReconciliation/QuranReconciliation.csproj -c Release -r win-x64 --no-restore -p:SourceRevisionId=$env:SOURCE_CANDIDATE_SHA

      - name: Publish portable self-contained folder
        shell: pwsh
        run: >
          dotnet publish ./src/QuranReconciliation/QuranReconciliation.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -p:SourceRevisionId=$env:SOURCE_CANDIDATE_SHA
          -o ./artifacts/The-Holy-Quran-TRP-Build-1.9-R5-win-x64

      - name: Verify packaged Context Atlas immutable resources
        shell: pwsh
        run: |
          $root = './artifacts/The-Holy-Quran-TRP-Build-1.9-R5-win-x64'
          $builtIn = Join-Path $root 'Corpus/ContextAtlas/BuiltIn'
          $templates = Join-Path $root 'Corpus/ContextAtlas/HandoffTemplates'
          $parts = @(Get-ChildItem $builtIn -Filter '*.b64part' -File | Sort-Object Name)
          if ($parts.Count -ne 42) { throw "Expected 42 packaged Edition 1 parts, got $($parts.Count)." }
          $encoded = [string]::Concat(@($parts | ForEach-Object { Get-Content -Raw $_.FullName }))
          $bytes = [Convert]::FromBase64String($encoded)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if ($hash -ne 'd4f572bdf94ff4a3d708258530f3d4bec5793fe0f061cc893ad682bf7150307f') {
            throw "Packaged Edition 1 ZIP hash mismatch: $hash"
          }
          foreach ($required in @(
            'Common/ISLAMIC-TERMINOLOGY-STANDARD.md',
            'Common/context-map-proposal-corpus-v1.schema.json',
            'Common/context-map-proposal-package-v1.schema.json',
            'Common/02-IMPORT-PACKAGE-CONTRACT.md',
            'Common/scripts/validate_proposal_package.py',
            'Common/scripts/show_english_window.py',
            'Common/scripts/validate_context_proposals.py',
            'New/00-READ-ME-FIRST.md',
            'New/01-MASTER-PROMPT.md'
          )) {
            if (-not (Test-Path (Join-Path $templates $required))) { throw "Missing packaged Atlas template: $required" }
          }
          if (Test-Path (Join-Path $root 'ContextAtlas/Imported')) { throw 'Clean package unexpectedly contains imported Atlas corpora.' }
          if (Test-Path (Join-Path $root 'ContextAtlas/Exports')) { throw 'Clean package unexpectedly contains Atlas exports.' }
          if (!(Test-Path (Join-Path $root 'Guides/THTRP-User-Guide.html'))) { throw 'Offline guide not packaged.' }
          Write-Host 'Packaged Context Atlas and offline Help resources: PASS'

      - name: Verify packaged and embedded Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $root = './artifacts/The-Holy-Quran-TRP-Build-1.9-R5-win-x64'
          $iconPath = Join-Path $root 'Assets/QuranReconciliation.ico'
          $exe = Join-Path $root 'The Holy Quran TRP.exe'
          $sourceIcon = [System.Drawing.Icon]::new($iconPath)
          $embeddedIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe))
          if ($null -eq $embeddedIcon) { throw 'Published EXE has no associated icon.' }
          $sourcePng = Join-Path $env:RUNNER_TEMP 'source-icon.png'
          $embeddedPng = Join-Path $env:RUNNER_TEMP 'embedded-icon.png'
          $sb=$sourceIcon.ToBitmap(); $eb=$embeddedIcon.ToBitmap()
          $sb.Save($sourcePng,[System.Drawing.Imaging.ImageFormat]::Png)
          $eb.Save($embeddedPng,[System.Drawing.Imaging.ImageFormat]::Png)
          if ($sb.Width -ne $eb.Width -or $sb.Height -ne $eb.Height) {
            throw 'EXE and packaged icon bitmap dimensions differ.'
          }
          $different=0
          for($y=0;$y -lt $sb.Height;$y++) {
            for($x=0;$x -lt $sb.Width;$x++) {
              if ($sb.GetPixel($x,$y).ToArgb() -ne $eb.GetPixel($x,$y).ToArgb()) { $different++ }
            }
          }
          if ($different -ne 0) { throw "EXE and packaged icons differ in $different pixels." }
          Write-Host 'Packaged and embedded icon pixels: IDENTICAL'
          $sb.Dispose(); $eb.Dispose(); $sourceIcon.Dispose(); $embeddedIcon.Dispose()

      - name: Verify compiled Per-Monitor V2 manifest
        shell: pwsh
        run: |
          $exe = './artifacts/The-Holy-Quran-TRP-Build-1.9-R5-win-x64/The Holy Quran TRP.exe'
          $binary = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($needle in @('true/PM','PerMonitorV2, PerMonitor','Microsoft.UI.Dispatching.DispatcherQueue')) {
            if (-not $binary.Contains($needle)) { throw "Compiled manifest missing: $needle" }
          }

      - name: Bundle pinned Quran Foundation fonts
        shell: pwsh
        run: |
          $root = './artifacts/The-Holy-Quran-TRP-Build-1.9-R5-win-x64'
          $fonts = Join-Path $root 'Fonts'
          New-Item -ItemType Directory -Path $fonts -Force | Out-Null
          $indo = Join-Path $fonts 'indopak-nastaleeq-waqf-lazim-v4.2.1.ttf'
          $uth = Join-Path $fonts 'UthmanicHafs1Ver18.ttf'
          Invoke-WebRequest 'https://verses.quran.foundation/fonts/quran/hafs/nastaleeq/indopak/indopak-nastaleeq-waqf-lazim-v4.2.1.ttf' -OutFile $indo
          Invoke-WebRequest 'https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.ttf' -OutFile $uth
          if ((Get-FileHash $indo -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4c8f002e7538ef6351ac676eb0f2c1708ecd17f6f8a5fc4a19dbc8eaf4dddff5') { throw 'IndoPak font mismatch.' }
          if ((Get-FileHash $uth -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a0636e68e375af9552470d67773936f54d536e6586ce2608311b2fe7f9cbec3a') { throw 'Uthmani font mismatch.' }

      - name: Add exact primary and supplementary corpora
        shell: pwsh
        run: |
          $target = './artifacts/The-Holy-Quran-TRP-Build-1.9-R5-win-x64/Corpus'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item './artifacts/Corpus/*' $target -Recurse -Force
          foreach ($required in @('corpus.sqlite','word-by-word.sqlite','juz-map.json')) {
            if (-not (Test-Path (Join-Path $target $required))) { throw "Missing packaged corpus file: $required" }
          }

      - name: Launch v1.4 real-corpus workstation
        shell: pwsh
        run: |
          $root = Resolve-Path './artifacts/The-Holy-Quran-TRP-Build-1.9-R5-win-x64'
          $exe = Join-Path $root 'The Holy Quran TRP.exe'
          $process = Start-Process -FilePath $exe -PassThru
          $diag = Join-Path $root 'Diagnostics/startup.log'
          $deadline = [DateTime]::UtcNow.AddSeconds(45)
          $hwnd = [IntPtr]::Zero
          do {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
            if ($process.HasExited) {
              if (Test-Path $diag) { Get-Content -Raw $diag | Write-Host }
              throw 'v1.4 app exited during real-corpus launch.'
            }
            $hwnd = $process.MainWindowHandle
          } while ($hwnd -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline)
          if ($hwnd -eq [IntPtr]::Zero) {
            if (Test-Path $diag) { Get-Content -Raw $diag | Write-Host }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'v1.4 did not expose a main window handle within 45 seconds.'
          }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class DpiProbeV14 {
            [DllImport("user32.dll")] public static extern IntPtr GetWindowDpiAwarenessContext(IntPtr hwnd);
            [DllImport("user32.dll")] [return: MarshalAs(UnmanagedType.Bool)] public static extern bool AreDpiAwarenessContextsEqual(IntPtr a, IntPtr b);
          }
          '@
          $context=[DpiProbeV14]::GetWindowDpiAwarenessContext($hwnd)
          if (-not [DpiProbeV14]::AreDpiAwarenessContextsEqual($context,[IntPtr](-4))) {
            throw "v1.4 main window is not Per-Monitor V2."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host 'v1.4 real-corpus launch: PASS'

      - name: Inspect packaged research DB remains schema 7
        shell: pwsh
        run: dotnet run --project ./tools/ContextWorkflowProbe/ContextWorkflowProbe.csproj -c Release -- --inspect ./artifacts/The-Holy-Quran-TRP-Build-1.9-R5-win-x64/Data/research.sqlite

      - name: Verify portable research-state relocation
        shell: pwsh
        run: |
          $root = Resolve-Path './artifacts/The-Holy-Quran-TRP-Build-1.9-R5-win-x64'
          dotnet run --project ./tools/PortabilityProbe/PortabilityProbe.csproj -c Release -- --seed $root
          if ($LASTEXITCODE -ne 0) { throw 'Portability seed failed.' }
          $relocated = './artifacts/v14-portability-relocated'
          Remove-Item $relocated -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $relocated -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $relocated 'Corpus') -Force | Out-Null
          Copy-Item (Join-Path $root 'Data') (Join-Path $relocated 'Data') -Recurse
          Copy-Item (Join-Path $root 'Corpus/corpus.sqlite') (Join-Path $relocated 'Corpus/corpus.sqlite')
          dotnet run --project ./tools/PortabilityProbe/PortabilityProbe.csproj -c Release -- --verify $relocated
          if ($LASTEXITCODE -ne 0) { throw 'Portability verification failed.' }
          Remove-Item $relocated -Recurse -Force

      - name: Clean generated owner state
        shell: pwsh
        run: |
          $root = './artifacts/The-Holy-Quran-TRP-Build-1.9-R5-win-x64'
          Remove-Item (Join-Path $root 'Data') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $root 'Backups') -Recurse -Force -ErrorAction SilentlyContinue
