name: THTRP C2c R2 Morphology Alignment Gate
on:
  push:
    branches: [ci/build-2.0-search]
    paths: [CI-MORPH-ALIGNMENT-CHECKPOINT.json]
permissions:
  contents: read
  actions: read
jobs:
  morphology-alignment:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact private probe and rollback IDs
        shell: pwsh
        run: |
          $m=Get-Content -Raw ./CI-MORPH-ALIGNMENT-CHECKPOINT.json | ConvertFrom-Json
          if ($m.private_source -ne 'd97875b455200724f0c483b372b18715437a01fc') { throw 'Source ref mismatch' }
          if ($m.r5_rollback -ne '6b54c3987934caa860094adcbc92ccf504b9342b') { throw 'Rollback mismatch' }
          $actual=(git rev-parse 'HEAD:tools/CorpusLemmaAlignmentProbe/validate_lemma_alignment.py').Trim()
          if ($actual -ne '4d3f61d83fbc91acb5d89115155e1101839ef54f') { throw 'Private source blob differs' }
      - name: Retrieve frozen R5 canonical corpus and word positions
        uses: actions/download-artifact@v4
        with:
          name: The-Holy-Quran-TRP-Build-1.9-R5-win-x64
          repository: paglaaacoc/-_-fehu-H-_-
          run-id: 37973098209
          github-token: ${{ github.token }}
          path: ./r5
      - name: Retrieve public pinned QAC v0.4 morphology annotation
        shell: pwsh
        run: |
          git clone --no-checkout --filter=blob:none --quiet https://github.com/taziksh/quran-frequencies.git ./qac-upstream
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve pinned original QAC Git repository' }
          git -C ./qac-upstream cat-file -t b91cec6e95d5e0306550b4aedacc7380dc71152a
          if ($LASTEXITCODE -ne 0) { throw 'Pinned morphology Git blob unavailable' }
          python -c "import subprocess,pathlib; p=pathlib.Path('qac-morphology-v0.4.txt'); r=subprocess.run(['git','-C','qac-upstream','cat-file','blob','b91cec6e95d5e0306550b4aedacc7380dc71152a'], stdout=subprocess.PIPE,check=True); p.write_bytes(r.stdout); print('Pinned morphology bytes:',len(r.stdout))"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to materialize exact Git blob' }
          $sha=(git hash-object --no-filters ./qac-morphology-v0.4.txt).Trim()
          if ($sha -ne 'b91cec6e95d5e0306550b4aedacc7380dc71152a') { throw "Pinned QAC data mismatch: $sha" }
          Write-Host 'Pinned QAC morphology v0.4: Git blob SHA PASS; original license/source remain intact'
      - name: Validate all word positions and target lemmas
        shell: pwsh
        run: |
          python ./tools/CorpusLemmaAlignmentProbe/validate_lemma_alignment.py --annotation ./qac-morphology-v0.4.txt --corpus ./r5/Corpus/corpus.sqlite --word-by-word ./r5/Corpus/word-by-word.sqlite
          if ($LASTEXITCODE -ne 0) { throw 'Arabic morphology source alignment gate did not pass; do not package anything' }
