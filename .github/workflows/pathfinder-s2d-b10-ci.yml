name: Pathfinder S2D B10 inactive real-provider save-wiring CI
on:
  push:
    branches:
      - dev/pathfinder-scratchpad-s2-r1-20261009
    paths:
      - ci/pathfinder-s2d-b10/**
      - .github/workflows/pathfinder-s2d-b10-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gates:
    if: github.ref == 'refs/heads/dev/pathfinder-scratchpad-s2-r1-20261009'
    runs-on: windows-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: backup-harness
            platform: x64
            rid: win-x64
          - lane: winui-x64
            platform: x64
            rid: win-x64
          - lane: winui-arm64
            platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable B3 ZIP, manifest and medical payload before execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'NivareQ-Pathfinder-S2D-B3-INTERNAL-Full-Source-2026-10-10.zip'
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'B3 source ZIP missing.' }
          $expected = '226728052a16d5d88ca470d7c17b15324de5e517c2b09788475925472c640a27'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $expected) { throw "Wrong source ZIP SHA: $hash" }
          $dst = Join-Path $env:GITHUB_WORKSPACE '_pathfinder_s2d_b3_source'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$dst)
          $manifest = Get-Content -LiteralPath (Join-Path $dst 'INTEGRITY-S2D-B3-MANIFEST.json') -Raw | ConvertFrom-Json
          if ($manifest.checkpoint -notlike 'S2-D B3 INTERNAL*') { throw 'Wrong B3 source manifest.' }
          $entries = @($manifest.hashes_sha256_excluding_this_manifest.PSObject.Properties)
          if ($entries.Count -ne 609) { throw "B3 manifest count mismatch: $($entries.Count)" }
          foreach ($e in $entries) {
            $path = [string]$e.Name
            if ($path.Contains('..') -or [IO.Path]::IsPathRooted($path) -or $path.StartsWith('/')) { throw "Unsafe source path: $path" }
            $file = Join-Path $dst $path
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing source: $path" }
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$e.Value) { throw "Source hash mismatch: $path" }
          }
          & (Join-Path $dst 'tools/verify-medical-payload.ps1')
          Write-Host 'PASS exact B3 source, 609 signed-manifest hashes and 132 preserved medical files.'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run portable B1 B2 B3 static and inherited JS contract guards
        if: matrix.lane == 'backup-harness'
        shell: pwsh
        working-directory: ./_pathfinder_s2d_b3_source
        run: |
          node tests/NotesProtocolHarness/run.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/NotesWebTransportHarness/run.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/NotesLifecycleJsHarness/run.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/s2d_b1_static_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/s2d_b2_coherent_static_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/s2d_b3_budget_static_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B3 R2 canonical negative-test fixture correction (hash-guarded, runner only)
        if: matrix.lane == 'backup-harness'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $env:GITHUB_WORKSPACE '_pathfinder_s2d_b3_source/tests/NotesBackupVNextHarness/Program.cs'
          $oldHash = '2039d471040824a1b73f36fd975c5329fc2de65b4d2c8ba7f6af775c41095fb1'
          $newHash = '5b4596029ad4225909ea73ff4ae9992851a9143e1ac821e6acf4fdd3e63908ea'
          $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $oldHash) { throw "Unexpected B3 source harness; no patch: $actual" }
          $source = [IO.File]::ReadAllText($file)
          $pairs = @(
            @{ from = 'obj.GetProperty("BackupSchemaVersion").GetInt32()!=7'; to = '!obj.TryGetProperty("BackupSchemaVersion", out var schema) || schema.ValueKind != JsonValueKind.Number || schema.GetInt32()!=7' },
            @{ from = 'obj.GetProperty("FormatId").GetString()!="nivareq.step2pathfinder.backup"'; to = '!obj.TryGetProperty("FormatId", out var format) || format.ValueKind != JsonValueKind.String || format.GetString()!="nivareq.step2pathfinder.backup"' },
            @{ from = 'obj.GetProperty("ContractAuthority").GetString()!="windows-canonical"'; to = '!obj.TryGetProperty("ContractAuthority", out var authority) || authority.ValueKind != JsonValueKind.String || authority.GetString()!="windows-canonical"' }
          )
          foreach ($pair in $pairs) {
            if ([regex]::Matches($source,[regex]::Escape([string]$pair.from)).Count -ne 1) { throw "B3 R2 fixture anchor absent or ambiguous: $($pair.from)" }
            $source = $source.Replace([string]$pair.from, [string]$pair.to)
          }
          [IO.File]::WriteAllText($file,$source,[Text.UTF8Encoding]::new($false))
          $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $newHash) { throw "R2 fixture hash mismatch: $actual" }
          Write-Host 'Verified test-only change: all missing canonical fields reject explicitly; B3 runtime untouched.'
      - name: Normalize CI-only Git checkout EOL to verified authored LF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # GitHub Windows checkout may normalize text files to CRLF while
          # their source SHA-256 contracts are intentionally authored on LF.
          # Touch ONLY ci/ overlay files; NEVER the immutable B3 ZIP/source.
          foreach ($relative in @('ci/pathfinder-s2d-b4', 'ci/pathfinder-s2d-b6-b7', 'ci/pathfinder-s2d-b8', 'ci/pathfinder-s2d-b9', 'ci/pathfinder-s2d-b10')) {
            $dir = Join-Path $env:GITHUB_WORKSPACE $relative
            if (-not (Test-Path -LiteralPath $dir -PathType Container)) { throw "Missing CI source: $relative" }
            foreach ($file in @(Get-ChildItem -LiteralPath $dir -File)) {
              if ($file.Extension -notin @('.cs', '.csproj', '.txt')) { continue }
              $value = [IO.File]::ReadAllText($file.FullName)
              $normalized = $value.Replace("`r`n", "`n")
              if ($value -cne $normalized) {
                [IO.File]::WriteAllText($file.FullName, $normalized, [Text.UTF8Encoding]::new($false))
                Write-Host "Authored-LF restored: $relative/$($file.Name)"
              }
            }
          }
          Write-Host 'Only CI overlay text EOL normalized, native hash gates remain intact.'
      - name: Overlay and hash-verify exact B4/B5 staged sources (all lanes)
        shell: pwsh
        env:
          PF_LANE: ${{ matrix.lane }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE '_pathfinder_s2d_b3_source'
          $ci = Join-Path $env:GITHUB_WORKSPACE 'ci/pathfinder-s2d-b4'
          $services = Join-Path $stage 'src/NivareQ.Step2Pathfinder/Services'
          $sources = @{
            'NotesVNextProviderAuthorityV1.cs'='2fe04ff9b1b184e3de48b8ead7c3627e0fbdc539a195adc18c4190912a9cfe4f'
            'NotesVNextCanonicalBridgeV1.cs'='584ae1dda3f93d01d2ba3a3f4b1940b8c9f1ce478b72644bdfcc3e7f52dea1e6'
            'NotesVNextRestorePreparationV1.cs'='6597d66f384f629f85e3a8f8964b8cf55ce2cfa6767e5cfb28912796cf68197c'
          }
          foreach ($entry in $sources.GetEnumerator()) {
            $src = Join-Path $ci $entry.Key
            if ((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value) { throw "S2D B4/B5 GitHub source differs: $($entry.Key)" }
            $dst = Join-Path $services $entry.Key
            if (Test-Path -LiteralPath $dst) { throw "Refusing to overwrite inherited production path: $dst" }
            Copy-Item -LiteralPath $src -Destination $dst
            if ((Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value) { throw "Overlay source mismatch: $($entry.Key)" }
          }
          if ($env:PF_LANE -eq 'backup-harness') {
            $project = Join-Path $stage 'tests/NotesBackupVNextHarness/NotesBackupVNextHarness.csproj'
            $xml = [IO.File]::ReadAllText($project)
            $anchor = '  <Compile Include="../../src/NivareQ.Step2Pathfinder/Services/NotesBackupVNextV1.cs" Link="NotesBackupVNextV1.cs" />'
            if ($xml.Split([string[]]@($anchor),[StringSplitOptions]::None).Count -ne 2) { throw 'Missing unique native harness project anchor.' }
            $xml = $xml.Replace($anchor,$anchor + "`n  <Compile Include=`"../../src/NivareQ.Step2Pathfinder/Services/NotesVNextProviderAuthorityV1.cs`" Link=`"NotesVNextProviderAuthorityV1.cs`" />")
            [IO.File]::WriteAllText($project,$xml,[Text.UTF8Encoding]::new($false))
            if ((Get-FileHash -LiteralPath $project -Algorithm SHA256).Hash.ToLowerInvariant() -ne '76231a6a88e6d6d13dd10957cc008f49bf2054dbf335541d0e6b8c38c4e14c68') { throw 'B4 native harness project parity failed.' }
            $program = Join-Path $stage 'tests/NotesBackupVNextHarness/Program.cs'
            if ((Get-FileHash -LiteralPath $program -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5b4596029ad4225909ea73ff4ae9992851a9143e1ac821e6acf4fdd3e63908ea') { throw 'B3 R2 harness parent parity failed.' }
            $code = [IO.File]::ReadAllText($program)
            $anchor = 'var temp=Path.Combine(Path.GetTempPath(),"nqpf-vnext-b1-"+Guid.NewGuid().ToString("N"));'
            if ($code.Split([string[]]@($anchor),[StringSplitOptions]::None).Count -ne 2) { throw 'Missing unique B4 test insertion anchor.' }
            $snippet = [IO.File]::ReadAllText((Join-Path $ci 'ProviderPolicyAssertions.txt'))
            if ((Get-FileHash -LiteralPath (Join-Path $ci 'ProviderPolicyAssertions.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'cd7241659eab894dbbb2c5469955b6c7e9821e54dd9f23b305bb5c107ec90f70') { throw 'B4 fixture assertions mismatch.' }
            [IO.File]::WriteAllText($program,$code.Replace($anchor,$snippet+$anchor),[Text.UTF8Encoding]::new($false))
            if ((Get-FileHash -LiteralPath $program -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5c1cb6fdd158e1ec595e2a14bc53398aaf0ff302ff19ccdc9cebee26d12a5ba9') { throw 'B4/B5 native test source parity failed.' }
          }
          Write-Host 'S2D B4/B5: verified exact local and GitHub source hashes, no live feature hook.'
      - name: Hash-guarded B6 B7 inactive overlay and coordinator test harness
        shell: pwsh
        env:
          PF_LANE: ${{ matrix.lane }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ci = Join-Path $env:GITHUB_WORKSPACE 'ci/pathfinder-s2d-b6-b7'
          $stage = Join-Path $env:GITHUB_WORKSPACE '_pathfinder_s2d_b3_source'
          $services = Join-Path $stage 'src/NivareQ.Step2Pathfinder/Services'
          $source = @{
            'NotesVNextMutationCoordinatorV1.cs'='602361c3baa08061d34d2235a1ccccf68d63187fbf8f39f2a16596f1335313f7'
            'NotesVNextSevenProviderPlanV1.cs'='ded5f3f553a28e9d640f21e9728c7042386ac3cba9494e72dbc5ea97df342cdf'
          }
          foreach ($pair in $source.GetEnumerator()) {
            $inputPath = Join-Path $ci $pair.Key
            $destPath = Join-Path $services $pair.Key
            if ((Get-FileHash -LiteralPath $inputPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pair.Value) { throw "GitHub source mismatch: $($pair.Key)" }
            if (Test-Path -LiteralPath $destPath) { throw "Refusing to overwrite inherited source: $destPath" }
            Copy-Item -LiteralPath $inputPath -Destination $destPath
            if ((Get-FileHash -LiteralPath $destPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pair.Value) { throw "B6/B7 overlay hash mismatch." }
          }
          if ($env:PF_LANE -eq 'backup-harness') {
            $tests = Join-Path $stage 'tests/NotesVNextCoordinatorHarness'
            New-Item -ItemType Directory -Path $tests -ErrorAction Stop | Out-Null
            $files = @{
              'NotesVNextCoordinatorHarness-Program.cs'=@('Program.cs','be0401d66ab99966ea8dde700b67611ec021337bed3be0ba94a0c0a2a1bcc414')
              'NotesVNextCoordinatorHarness.csproj'=@('NotesVNextCoordinatorHarness.csproj','ed38d3a1a37a88804973cb2a45a35fcb544c742b200ffa34ca7f11c494016f3f')
            }
            foreach ($pair in $files.GetEnumerator()) {
              $p = Join-Path $ci $pair.Key
              if ((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pair.Value[1]) { throw "Native harness source mismatch: $($pair.Key)" }
              Copy-Item -LiteralPath $p -Destination (Join-Path $tests $pair.Value[0])
            }
          }
          Write-Host 'B6 B7 byte-exact inactive overlays: sources and .NET coordinator harness staged.'
      - name: B8 exact source overlay and fake-journal harness
        shell: pwsh
        env:
          PF_LANE: ${{ matrix.lane }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE '_pathfinder_s2d_b3_source'
          $ci=Join-Path $env:GITHUB_WORKSPACE 'ci/pathfinder-s2d-b8'
          $files=@{
            'NotesVNextCommitBoundaryV1.cs'=@('src/NivareQ.Step2Pathfinder/Services/NotesVNextCommitBoundaryV1.cs','c60b4dada0bb1466caddc03747687abfd79466b40a177a6930b1e4a5143ad632')
          }
          if ($env:PF_LANE -eq 'backup-harness') {
            $files['Program.cs']=@('tests/NotesVNextCommitHarness/Program.cs','71a5628a37d3bed3d01fec0b230d90a4fb7ba430d8cf8a951d28ac6dbd19d407')
            $files['NotesVNextCommitHarness.csproj']=@('tests/NotesVNextCommitHarness/NotesVNextCommitHarness.csproj','2b47a0793c9864b8f1b630b5734d7f6df3cc5207bd5f14e0da8f699ce00a89ab')
          }
          foreach ($item in $files.GetEnumerator()) {
            $src=Join-Path $ci $item.Key
            $target=Join-Path $root $item.Value[0]
            if ((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item.Value[1]) { throw "B8 source hash mismatch: $($item.Key)" }
            if (Test-Path -LiteralPath $target) { throw "B8 refuses overwrite of inherited path: $target" }
            New-Item -ItemType Directory -Path (Split-Path -Parent $target) -Force | Out-Null
            Copy-Item -LiteralPath $src -Destination $target
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item.Value[1]) { throw "B8 overlay mismatch: $target" }
          }
          Write-Host 'B8 exact source overlay validated. No runtime callers installed.'
      - name: Overlay B9 inactive admission source and hermetic test harness
        shell: pwsh
        env:
          PF_LANE: ${{ matrix.lane }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE '_pathfinder_s2d_b3_source'
          $ci = Join-Path $env:GITHUB_WORKSPACE 'ci/pathfinder-s2d-b9'
          $files = @{
            'NotesVNextWriterAdmissionV1.cs'=@('src/NivareQ.Step2Pathfinder/Services/NotesVNextWriterAdmissionV1.cs','8f9dc229ffb4a18f35f6373d76378611f8e5a1b338cb00b66662b73e483c8701')
          }
          if ($env:PF_LANE -eq 'backup-harness') {
            $files['Program.cs'] = @('tests/NotesVNextAdmissionHarness/Program.cs','794d4679a426f8a121056294a020eb39a929baeae7e2dcb01916c501f4b8fa49')
            $files['NotesVNextAdmissionHarness.csproj'] = @('tests/NotesVNextAdmissionHarness/NotesVNextAdmissionHarness.csproj','43d8b493541b802ecd7e5b26eeb0d17d7341b1200ad8c62e943ee17612fce788')
          }
          foreach ($file in $files.GetEnumerator()) {
            $src = Join-Path $ci $file.Key
            $dst = Join-Path $root $file.Value[0]
            if ((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.Value[1]) { throw "B9 authored source mismatch: $($file.Key)" }
            if (Test-Path -LiteralPath $dst) { throw "Refusing to overwrite frozen source: $dst" }
            New-Item -ItemType Directory -Path (Split-Path -Parent $dst) -Force | Out-Null
            Copy-Item -LiteralPath $src -Destination $dst
            if ((Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.Value[1]) { throw "B9 copied source mismatch" }
          }
          Write-Host 'B9 inactive source compiled in CI; no live writer enrollment or restore activation.'
      - name: B10 source-frozen patch and inactive real Save/queued-epoch overlay
        shell: pwsh
        env:
          PF_LANE: ${{ matrix.lane }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE '_pathfinder_s2d_b3_source'
          $ci=Join-Path $env:GITHUB_WORKSPACE 'ci/pathfinder-s2d-b10'
          $patchB64=Join-Path $ci 'authoritative-services.patch.gz.b64'
          if ((git hash-object -- $patchB64).Trim() -ne '16c2d23a34bf8d6e5c8b4bd10e55330e5b26c39c') { throw 'B10 compressed source patch blob identity mismatch.' }
          $compressed=[Convert]::FromBase64String([IO.File]::ReadAllText($patchB64).Trim())
          $ms=[IO.MemoryStream]::new($compressed)
          $gzip=[IO.Compression.GZipStream]::new($ms,[IO.Compression.CompressionMode]::Decompress)
          $patchPath=Join-Path $env:RUNNER_TEMP 's2d-b10-write-hooks.patch'
          $out=[IO.File]::Create($patchPath)
          try { $gzip.CopyTo($out) } finally { $out.Dispose();$gzip.Dispose();$ms.Dispose() }
          if ((Get-FileHash -LiteralPath $patchPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5d20c9c0708d4cac1afc6a4a5f6609e2ed2786ed8053d6a202704772e5b74894') { throw 'B10 decoded patch integrity mismatch.' }
          $paths=@{
           'src/NivareQ.Step2Pathfinder/Services/SettingsService.cs'=@('8b86843427c206d1f2725a1a9bc8340f3099cfda8ce2240046b5a2bdb3af3cf6','e15ee65108da2894b90af818ed9c6ac874232e0156a32203fe17cccfe93c6c48')
           'src/NivareQ.Step2Pathfinder/Services/PersonalStudyService.cs'=@('383c74386adae9984db770639f27d03a7d19766297cb7a48a4bd54821905a79e','297a152afcf1fcb084cfa500d29cc71e6ec1a650eafcb715752c4d763bdcc1f4')
           'src/NivareQ.Step2Pathfinder/Services/JournalService.cs'=@('352750a87d2412a7bc412da44332e88dfe259266caa81df5fd084d569f167b7e','12fdebdbd57d8fd83452a37d43a4204863428c9c451e4f2f153b938291215f4c')
           'src/NivareQ.Step2Pathfinder/Services/UWorldSelectorService.cs'=@('717cbefa95ef0cdcf25f9ddbe0af8c68d35a080a9ae14749d532f3e5047c43f3','2711ba255f0390d2219ace5ac2a0a485631ac2e15aeddd5f8a5ebf598b084c06')
           'src/NivareQ.Step2Pathfinder/Services/BackupExtensionStore.cs'=@('39db39ff8071e55c03955231c6163c46c8eaf47dcf42df8326dc0fdcb33937f8','20e02141c5a0bc4c9149fe15e5730117aab1958e5732ad3c91076418529305d9')
           'src/NivareQ.Step2Pathfinder/Services/CockpitStateService.cs'=@('3d0be68227df7819c2a00fd6b3d9f142b43f7b5ead650696dc61d66f9e473296','57db28d6e2a077a84da88079b745d5c0958431b7c7b5a8be8c4d5c721f78645a')
           'src/NivareQ.Step2Pathfinder/MainWindow.PersonalStudy.cs'=@('6cf1f87eba1652bfc8b61a3be34336c42e5d244f7f90638605cb1e2b3615bc62','883736dd59ab20d696f3ff472260efdd564eafd967ed25b7396e7b0c2b1eb61e')
           'src/NivareQ.Step2Pathfinder/MainWindow.CockpitHost.cs'=@('d050755aa80361f1dc6d0dd07c0b15389958b51334f75572b3614ad6cb4dc965','4fefa9f5fbb6fe67c0a2753c9e318c0cb599bdfe6159b27f0df88d9ada90b59f')
          }
          foreach($entry in $paths.GetEnumerator()){
            $target=Join-Path $root $entry.Key
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value[0]) { throw "B10 refused non-B9 inherited source: $($entry.Key)" }
          }
          & git -C $root apply --check $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'B10 source patch does not apply' }
          & git -C $root apply $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'B10 source patch failed' }
          # Windows git apply may rewrite touched files as CRLF according to
          # checkout autocrlf. Restore authored LF ONLY for the eight exact
          # patched files, then enforce their immutable Full Source hashes.
          foreach($entry in $paths.GetEnumerator()){
            $target=Join-Path $root $entry.Key
            $data=[IO.File]::ReadAllText($target)
            $lf=$data.Replace("`r`n","`n")
            if ($data -cne $lf){ [IO.File]::WriteAllText($target,$lf,[Text.UTF8Encoding]::new($false)) }
          }
          foreach($entry in $paths.GetEnumerator()){
            $target=Join-Path $root $entry.Key
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value[1]) { throw "B10 resulting source differs from Full Source: $($entry.Key)" }
          }
          $serviceSrc=Join-Path $ci 'NotesVNextWriteInstrumentationV1.cs'
          if ((git hash-object -- $serviceSrc).Trim() -ne '49edb4bd28a1bda29a403f2992364497f9677cc2') { throw 'B10 runtime hook blob does not match Full Source.' }
          $dst=Join-Path $root 'src/NivareQ.Step2Pathfinder/Services/NotesVNextWriteInstrumentationV1.cs'
          if (Test-Path -LiteralPath $dst){throw 'B10 hook unexpectedly overwrites inherited source'}
          Copy-Item -LiteralPath $serviceSrc -Destination $dst
          if ((Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'da0a27ed56cfd8d82d2b1bd86d4b229dfc089d7b13d59c7be80b5401f709a55f') { throw 'B10 hook copy hash mismatch.' }
          if ($env:PF_LANE -eq 'backup-harness'){
            $tests=Join-Path $root 'tests/NotesVNextRealSaveHooksHarness'
            New-Item -ItemType Directory -Path $tests -Force | Out-Null
            $testFiles=@{
             'Program.cs'='78591eea33003a8b7e0e6db85f14b8236322e290'
             'NotesVNextRealSaveHooksHarness.csproj'='91bf6f301ca862584b1951bb7c30defc8130df23'
            }
            foreach($entry in $testFiles.GetEnumerator()){
              $input=Join-Path $ci $entry.Key
              if ((git hash-object -- $input).Trim() -ne $entry.Value) { throw "B10 native harness blob changed: $($entry.Key)" }
              Copy-Item -LiteralPath $input -Destination (Join-Path $tests $entry.Key)
            }
          }
          Write-Host 'B10 authored patch, provider Save wiring and native harness validated. The opt-in writer attachment is uninstalled.'
